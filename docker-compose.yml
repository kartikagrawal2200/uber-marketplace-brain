services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false

  rider-app:
    build: { context: ./frontend, dockerfile: rider-app/Dockerfile }
    environment: { BACKEND_URL: "http://backend:8000" }
    ports: ["5173:5173"]
    depends_on: [backend]

  driver-app:
    build: { context: ./frontend, dockerfile: driver-app/Dockerfile }
    environment: { BACKEND_URL: "http://backend:8000" }
    ports: ["5174:5174"]
    depends_on: [backend]

  admin-dashboard:
    build: { context: ./frontend, dockerfile: admin-dashboard/Dockerfile }
    environment: { BACKEND_URL: "http://backend:8000" }
    ports: ["5175:5175"]
    depends_on: [backend]
