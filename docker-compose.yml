version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # TODO: Add depends_on for DB service if you switch from SQLite

  rider-app:
    build:
      context: ./frontend/rider-app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

  driver-app:
    build:
      context: ./frontend/driver-app
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      - backend

  admin-dashboard:
    build:
      context: ./frontend/admin-dashboard
      dockerfile: Dockerfile
    ports:
      - "5175:5175"
    depends_on:
      - backend

